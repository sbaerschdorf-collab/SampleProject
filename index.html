<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Haushaltsbuch</title>
</head>
<body>
  <h1>Haushaltsbuch</h1>

  <!-- Bereich: Login/Registrierung -->
  <div id="auth-bereich">
    <h2>Anmelden oder Registrieren</h2>
    <input type="email" id="email" placeholder="E-Mail">
    <input type="password" id="passwort" placeholder="Passwort">
    <br><br>
    <button id="btn-registrieren">Registrieren</button>
    <button id="btn-anmelden">Anmelden</button>
    <p id="auth-nachricht"></p>
  </div>

  <!-- Bereich: eingeloggt, aber noch KEIN Haushalt vorhanden -->
  <div id="haushalt-waehlen-bereich" style="display: none;">
    <h2>Haushalt einrichten</h2>
    <p id="nutzer-email-2"></p>
    <button id="btn-abmelden-2">Abmelden</button>

    <hr>

    <h3>Neuen Haushalt erstellen</h3>
    <input type="text" id="neuer-haushalt-name" placeholder="z.B. Familie Müller">
    <button id="btn-haushalt-erstellen">Erstellen</button>

    <hr>

    <h3>Bestehendem Haushalt beitreten</h3>
    <input type="text" id="beitritts-code" placeholder="Haushalts-ID einfügen">
    <button id="btn-haushalt-beitreten">Beitreten</button>

    <p id="haushalt-nachricht"></p>
  </div>

  <!-- Bereich: eingeloggt UND Haushalt vorhanden -->
  <div id="app-bereich" style="display: none;">
    <h2>Willkommen!</h2>
    <p id="nutzer-email"></p>
    <p id="haushalt-info"></p>
    <button id="btn-abmelden">Abmelden</button>

    <hr>

    <h3>Kategorien</h3>

    <div>
      <input type="text" id="neue-kategorie-name" placeholder="z.B. Lebensmittel">
      <select id="neue-kategorie-typ">
        <option value="expense">Ausgabe</option>
        <option value="income">Einnahme</option>
      </select>
      <button id="btn-kategorie-erstellen">Kategorie anlegen</button>
    </div>

    <p id="kategorie-nachricht"></p>

    <ul id="kategorien-liste"></ul>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
